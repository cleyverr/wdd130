<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity poll-form</title>
    <link rel="stylesheet" href="styles/table-exercise-solution.css">
</head>
<header>

</header>
<main>
    <form>
        <label>Full Name:<input type="text" id="fullname"name="fullname"required></label>
        <label>Email:<input type="email"id="useremail" name="useremail"required></label>
    </form>
    <label for="browser">What is your favorite Browser? </label>
    
    <select name="browser" id="browser">
            <option value="brave">Brave</option>
            <option value="edge">Edge</option>
            <option value="chrome">Chrome</option>
    </select>
    <label for="pet">Do you have a household pet? </label>
    <input type="checkbox" id="pet" name="pet">
    <label for="feedback">Name the places you have lived? </label>
    <textarea name="feedback" id="feedback" rows="4" placeholder="Durango CO, Tijuana Mexico, Rexburg ID, Houston TX."></textarea>
    <button type="submit">Submit Poll</button>
   </select>


</main>
<footer>

</footer>
